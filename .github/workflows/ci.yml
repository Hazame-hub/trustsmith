# Continuous integration for Trustsmith.
#
# The test jobs are the proof that the inspect slice works: build, vet, and
# every test — unit, golden, fuzz seed corpora and architecture tests — plus a
# smoke run of the real binary. Race, lint, vulnerability and short fuzzing
# jobs run once, on Linux.
#
# Runners. Linux jobs run on the self-hosted runner container for this
# repository (sybil-dev deploy/ci/runner-up.sh Hazame-hub/trustsmith; no
# Docker socket). There is no self-hosted runner for macOS or Windows, and
# GitHub-hosted jobs cannot start while the account's Actions billing is
# blocked, so the macOS and Windows tests run only when the repository variable
# HOSTED_RUNNERS is "true". They are kept, not removed: set the variable to
# bring them back.
#
# Actions are pinned to commit SHAs; the tag is in the trailing comment.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (linux-self-hosted)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: CLI smoke test
        shell: bash
        run: ./.github/workflows/smoke.sh

  test-hosted:
    name: test (${{ matrix.os }})
    if: ${{ vars.HOSTED_RUNNERS == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: CLI smoke test
        shell: bash
        run: ./.github/workflows/smoke.sh

  race:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Ensure a C toolchain
        # The race detector needs cgo. The runner user cannot sudo, so the
        # self-hosted runner container must carry gcc itself; GitHub-hosted
        # Ubuntu does.
        run: |
          if ! command -v gcc >/dev/null; then
            echo "::error::the race detector needs a C compiler; install gcc and libc6-dev in the runner image"
            exit 1
          fi
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

  lint:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  vulncheck:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    name: fuzz (short)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each parser boundary for 20s
        run: |
          go test -run '^$' -fuzz '^FuzzCanonicalSPKI$' -fuzztime 20s ./internal/fingerprint
          go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 20s ./internal/artifact
          go test -run '^$' -fuzz '^FuzzFromDER$' -fuzztime 20s ./internal/x509facts
          go test -run '^$' -fuzz '^FuzzInspectBytes$' -fuzztime 20s ./internal/app/inspectsvc
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s ./internal/endpoint
