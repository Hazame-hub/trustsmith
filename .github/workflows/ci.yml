# Continuous integration for Trustsmith.
#
# The test matrix is the proof that the inspect slice works on Linux, macOS
# and Windows: build, vet, and every test — unit, golden, fuzz seed corpora and
# architecture tests — plus a smoke run of the real binary. Race, lint,
# vulnerability and short fuzzing jobs run once, on Linux.
#
# Actions are pinned to commit SHAs; the tag is in the trailing comment.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: CLI smoke test
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -o "bin/trustsmith$ext" ./cmd/trustsmith
          "bin/trustsmith$ext" inspect testdata/certs/leaf.pem
          set +e
          "bin/trustsmith$ext" inspect testdata/certs/expired.pem > /dev/null
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::inspecting an expired certificate must exit 3, got $code"
            exit 1
          fi

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test with the race detector
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz each parser boundary for 20s
        run: |
          go test -run '^$' -fuzz '^FuzzCanonicalSPKI$' -fuzztime 20s ./internal/fingerprint
          go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 20s ./internal/artifact
          go test -run '^$' -fuzz '^FuzzFromDER$' -fuzztime 20s ./internal/x509facts
          go test -run '^$' -fuzz '^FuzzInspectBytes$' -fuzztime 20s ./internal/app/inspectsvc
          go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 20s ./internal/endpoint
